<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارت شناسایی داود قاسمی</title>
<style>
body{
    margin:0;
    font-family:tahoma;
    background:#eef1f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.card{
    width:420px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}
.header{
    background:#0b2c5f;
    color:white;
    text-align:center;
    padding:20px;
    font-size:26px;
    font-weight:bold;
}
.profile{
    text-align:center;
    padding:20px;
}
.profile img{
    width:140px;
    height:140px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid #0b2c5f;
}
.name{
    font-size:28px;
    font-weight:bold;
    margin-top:15px;
    color:#0b2c5f;
}
.job{
    font-size:18px;
    color:#666;
    margin-top:5px;
}
.info{
    padding:0 25px 25px;
}
.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #eee;
}
.label{
    font-weight:bold;
    color:#333;
}
.value{
    color:#555;
}
.footer{
    background:#0b2c5f;
    color:white;
    text-align:center;
    padding:12px;
    font-size:14px;
}
</style>
</head>
<body>

<div class="card">
<div class="header">
    <div style="font-size:20px;font-weight:bold;letter-spacing:1px;">
        شهرداری ملایر
    </div>
    <div style="width:80px;height:2px;background:#fff;margin:8px auto;"></div>
    <div style="font-size:26px;font-weight:bold;">
        کارت شناسایی پرسنل
    </div>
</div>
    <div class="profile">
        <img src="logo.jpg" alt="عکس پرسنلی">
        <div class="name">داود قاسمی</div>
        <div class="job">حوزه خدمات شهرداری</div>
    </div>

    <div class="info">
        <div class="row">
            <span class="label">شماره تماس:</span>
            <span class="value">0918***4534</span>
        </div>
        <div class="row">
            <span class="label">کد ملی:</span>
            <span class="value">393***4361</span>
        </div>
        <div class="row">
            <span class="label">محدوده کاری:</span>
            <span class="value"> بلوار نبوت حوزه خدمات شهرداری</span>
        </div>
        <div class="row">
            <span class="label">عنوان شغلی:</span>
            <span class="value">حسابدار</span>
        </div>
    </div>

    <div class="footer">
        اطلاعات فوق مربوط به کارت شناسایی این فرد می‌باشد.
    </div>
</div>

</body>
</html>
