<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کارت شناسایی پرسنل</title>

<style>
body{
    margin:0;
    font-family:tahoma;
    background:#eef1f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:420px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.header{
    background:#0b2c5f;
    color:white;
    text-align:center;
    padding:20px;
}

.profile{
    text-align:center;
    padding:20px;
}

.profile img{
    width:140px;
    height:140px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid #0b2c5f;
}

.name{
    font-size:28px;
    font-weight:bold;
    margin-top:15px;
    color:#0b2c5f;
}

.job{
    font-size:18px;
    color:#666;
}

.info{
    padding:0 25px 25px;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.label{
    font-weight:bold;
}

.value{
    color:#555;
    text-align:left;
}

.footer{
    background:#0b2c5f;
    color:white;
    text-align:center;
    padding:12px;
}
</style>

</head>

<body>

<div class="card">

<div class="header">
    <div style="font-size:20px;font-weight:bold;">
        شرکت فنی مهندسی بهین دشت ملایر
    </div>
    <hr>
    <div style="font-size:26px;font-weight:bold;">
        کارت شناسایی پرسنل
    </div>
</div>


<div class="profile">
    <img id="photo" src="logo.jpg">
    <div class="name" id="name"></div>
    <div class="job" id="job"></div>
</div>


<div class="info">

<div class="row">
<span class="label">کد ملی:</span>
<span class="value" id="code"></span>
</div>

<div class="row">
<span class="label">عنوان شغلی:</span>
<span class="value" id="job2"></span>
</div>

<div class="row">
<span class="label">محدوده کاری:</span>
<span class="value" id="area"></span>
</div>

<div class="row">
<span class="label">تلفن رسیدگی به شکایات شهرداری ملایر:</span>
<span class="value">137</span>
</div>


<div class="footer">
اطلاعات فوق مربوط به کارت شناسایی این فرد می‌باشد.
</div>

</div>


<script>

let params = new URLSearchParams(window.location.search);
let id = params.get("id") || "001";


fetch("data.json")
.then(res => res.json())
.then(data => {

let person = data.find(x => x.id === id);

if(person){

document.getElementById("name").innerText = person.name;
document.getElementById("job").innerText = person.job;
document.getElementById("job2").innerText = person.job;
document.getElementById("code").innerText = person.code;
document.getElementById("area").innerText = person.area;
document.getElementById("phone").innerText = person.phone;

if(person.photo){
document.getElementById("photo").src="photos/"+person.photo;
}

}

});

</script>


</body>
</html>
